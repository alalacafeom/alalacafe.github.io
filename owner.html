<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A08">
<title>alala owner</title>
<style>
:root{--bg:#0B0A08;--panel:#15130f;--fg:#F3EEE2;--muted:#a79f8d;--gold:#D9B861;--on-gold:#1a1405;--line:rgba(217,184,97,.22);--line2:rgba(217,184,97,.38);--ok:#7fd08a;--warn:#ff9c88;--blue:#8fb8ff}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif}
.ar{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:0;z-index:5;background:rgba(11,10,8,.95);border-bottom:1px solid var(--line);padding:10px 14px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
header img{height:28px}
.live{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-inline-end:5px;animation:p 2s infinite}
.dot.off{background:var(--warn);animation:none}
@keyframes p{50%{opacity:.35}}
.rb{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent}
.login{max-width:340px;margin:18vh auto 0;padding:24px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.login input{width:100%;min-height:50px;padding:10px 14px;text-align:center;font-size:20px;letter-spacing:6px;background:var(--bg);border:1px solid var(--line2);border-radius:12px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:600;margin-top:12px;width:100%}
.err{color:var(--warn);font-size:14px;margin:10px 0 0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile.big{grid-column:1/-1;border-color:var(--line2)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:2px}
.tile.big .v{font-size:38px}
.d{font-size:12px;margin-top:2px}.up{color:var(--ok)}.down{color:var(--warn)}.flat{color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:14px}
.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
.bars i.now{background:#fff3c9}
.bars span{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap}
.bars em{font-style:normal;font-size:9px;color:var(--gold);white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}.row .t small{display:block;color:var(--muted);font-size:12px}
.row b{color:var(--gold);font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.tag.warn{border-color:rgba(255,140,120,.5);color:var(--warn)}.tag.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.hb{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.hb .n{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .g{flex:1;height:8px;background:rgba(217,184,97,.12);border-radius:4px;overflow:hidden}.hb .g i{display:block;height:100%;background:var(--gold)}.hb .q{width:34px;text-align:end;color:var(--muted)}
input.n3{width:100%;min-height:46px;padding:0 12px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;font-size:18px}
.diff{margin-top:8px;font-size:15px;font-weight:600}
.empty{color:var(--muted);padding:10px 0;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent}.chip[aria-pressed=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.dates{display:flex;gap:8px;margin-top:10px}.dates input{flex:1;min-width:0;min-height:42px;padding:0 8px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color-scheme:dark}
.two{display:flex;gap:8px;margin-top:10px}.two button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:600}.two button.alt{background:transparent;color:var(--gold)}
#rep{display:none}
@page{size:A4;margin:11mm}
@media print{
  html{color-scheme:light!important}html,body{background:#fff!important;color:#000}header,#login,#app{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rep{display:block!important;color:#111;font-size:11px;line-height:1.35}
  #rep .hd{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:10px}
  #rep .hd img{height:34px;filter:brightness(0)}
  #rep .hd .tt{text-align:end}#rep h1{font-size:17px;margin:0}#rep .sub{color:#555;font-size:11px}
  #rep .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 6px}
  #rep .kp>div{border:1px solid #bbb;border-radius:6px;padding:6px 8px}
  #rep .kp .k{font-size:9.5px;color:#555}#rep .kp b{display:block;font-size:15px;margin-top:1px}
  #rep .kp .big{grid-column:span 2;background:#111;color:#fff;border-color:#111}#rep .kp .big .k{color:#ccc}#rep .kp .big b{font-size:22px}
  #rep .dl{font-size:10px;font-weight:600}#rep .up{color:#0a7a2f}#rep .dn{color:#b3261e}#rep .big .up{color:#8fe3a8}#rep .big .dn{color:#ffb4ab}
  #rep .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  #rep h3{font-size:11.5px;margin:10px 0 4px;padding-bottom:2px;border-bottom:1.5px solid #111;text-transform:uppercase;letter-spacing:.04em}
  #rep .row2 h3{margin-top:0}
  #rep table{width:100%;border-collapse:collapse;margin:0 0 4px}
  #rep th,#rep td{border-bottom:1px solid #ddd;padding:3px 5px;text-align:start;font-size:10.5px}
  #rep th{background:#eee;font-size:9.5px}#rep td.n,#rep th.n{text-align:end;font-variant-numeric:tabular-nums}
  #rep tr{break-inside:avoid;page-break-inside:avoid}
  #rep .pay{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid #111;margin:4px 0}
  #rep .pay i{display:block;height:100%}
  #rep .lg{font-size:10px;display:flex;justify-content:space-between}
  #rep .hrs{display:flex;align-items:flex-end;gap:2px;height:64px;border-bottom:1px solid #111}
  #rep .hrs i{flex:1;background:#555;min-height:1px;display:block}#rep .hrs i.pk{background:#111}
  #rep .hl{display:flex;gap:2px;font-size:8px;color:#555}#rep .hl span{flex:1;text-align:center}
  #rep .bar{display:inline-block;height:6px;background:#555;border-radius:3px;vertical-align:middle}
  #rep .ft{margin-top:10px;padding-top:6px;border-top:1px solid #bbb;color:#777;font-size:9px;display:flex;justify-content:space-between}
  #rep section{break-inside:avoid;page-break-inside:avoid}
  #rep .pg2{break-before:page;page-break-before:always}
  #rep .free{font-weight:700;background:#fff3c4}#rep .ol td{font-size:9.5px;vertical-align:top}#rep thead{display:table-header-group}
}
</style>
</head>

(function () {
  var API = (window.ALALA || {}).API_URL || '', pin = '', timer = 0, ok = false, last = null;
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function f3(n) { return (Number(n) || 0).toFixed(3); }

  function ago(iso) { var s = (Date.now() - new Date(iso).getTime()) / 60000; if (isNaN(s)) return ''; if (s < 1) return 'now · الآن'; if (s < 60) return Math.round(s) + ' min · د'; if (s < 1440) return Math.round(s / 60) + ' h · س'; return Math.round(s / 1440) + ' d · ي'; }
  function delta(c, p) {

    return '<div class="d ' + (x > 0 ? 'up' : x < 0 ? 'down' : 'flat') + '">' + (x > 0 ? '▲ ' : x < 0 ? '▼ ' : '') + Math.abs(x) + '% vs yesterday · عن أمس</div>';
  }
  function tile(k, v, extra, big) { return '<div class="tile' + (big ? ' big' : '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (extra || '') + '</div>'; }
  function bars(rows, nowKey) {

      var h = max ? Math.max(2, Math.round(r.v / max * 82)) : 2;
      return '<div class="c"><em>' + (r.v ? (r.v >= 100 ? Math.round(r.v) : (r.v % 1 ? r.v.toFixed(1) : r.v)) : '') + '</em><i class="' + (r.l === nowKey ? 'now' : '') + '" style="height:' + h + 'px"></i><span>' + esc(r.l) + '</span></div>';
    }).join('') + '</div>';
  }
  var TYPE = { dinein: 'Table · طاولة', pickup: 'Pickup · استلام', delivery: 'Delivery · توصيل', counter: 'Counter · كاونتر' };
  function render(d) {
    var t = d.day, p = d.prev, avg = t.orders ? t.total / t.orders : 0;
    var h = '<h2>Today · اليوم — ' + esc(d.today) + '</h2><div class="tiles">' +
      tile('Sales · المبيعات', f3(t.total) + ' <small style="font-size:14px">OMR</small>', delta(t.total, p.total), true) +
      tile('Orders · الطلبات', t.orders, delta(t.orders, p.orders)) + tile('Avg. order · متوسط الطلب', f3(avg)) +
      tile('💵 Cash · كاش', f3(t.cash)) + tile('💳 Card · فيزا', f3(t.card)) +
      tile('Open now · مفتوحة الآن', d.open.n, '<div class="d flat">' + f3(d.open.total) + ' OMR</div>') +

    var hrs = rot(d.hours).map(function (x) { return { l: String(x.h), v: x.total }; });
    h += '<h2>By hour · حسب الساعة</h2><div class="box">' + bars(hrs, String(new Date().getHours())) + '</div>';
    h += '<h2>Last 7 days · آخر ٧ أيام — ' + f3(d.weekTotal.total) + '</h2><div class="box">' + bars(d.week.map(function (x) { return { l: x.date.slice(5), v: x.total }; }), d.today.slice(5)) + '</div>';
    h += '<div class="tiles" style="margin-top:10px">' + tile('This month · هذا الشهر', f3(d.month.total), '<div class="d flat">' + d.month.orders + ' orders</div>') +
      tile('Customers today · العملاء', d.customers.fresh + ' + ' + d.customers.returning, '<div class="d flat">new · جدد + returning · عائدون</div>') + '</div>';
    var mx = 0; d.items.forEach(function (x) { if (x.qty > mx) mx = x.qty; });
    h += '<h2>Top items today · الأكثر مبيعاً</h2><div class="box">' + (d.items.length ? d.items.map(function (x) {
      return '<div class="hb"><span class="n">' + esc(x.en) + '</span><span class="g"><i style="width:' + (mx ? x.qty / mx * 100 : 0) + '%"></i></span><span class="q">' + x.qty + '</span></div>'; }).join('') : '<div class="empty">—</div>') + '</div>';
    h += '<h2>Alerts · تنبيهات (3 days)</h2><div class="box">' + (d.alerts.length ? d.alerts.map(function (a) {
      var x = a.x || a, tg = a.k === 'cancel' ? '<span class="tag warn">❌ Cancelled · ملغي</span>' : a.k === 'free' ? '<span class="tag gold">🎁 Free drink · مجاني</span>' : a.k === 'edit' ? '<span class="tag warn">✏️ Edited · معدّل ×' + a.n + '</span>' : '<span class="tag warn">🏷 ' + a.pct + '% discount · خصم' + (a.discount ? ' (−' + f3(a.discount) + ')' : '') + '</span>';
      var who = (TYPE[x.type] || x.type || '') + (x.table ? ' ' + esc(x.table) : '') + (x.name ? ' · ' + esc(x.name) : '') + (a.phone ? ' · +' + esc(a.phone) : '');
      return '<div class="row"><div class="t">' + tg + ' #' + a.id + (a.reason ? ' · <b>' + esc(a.reason) + '</b>' : '') +
        (x.items ? '<div style="margin:3px 0;color:var(--fg)">' + esc(x.items) + '</div>' : '') + '<small>' + ago(a.at) + ' · ' + who + '</small></div><b>' + f3(a.total) + '</b></div>'; }).join('') : '<div class="empty">All clear ✓ · لا شيء</div>') + '</div>';
    h += '<h2>Latest paid · آخر المدفوعات</h2><div class="box">' + (d.recent.length ? d.recent.map(function (o) {

    h += '<h2>Reports · التقارير</h2><div class="box"><div class="chips" id="rch">' +
      '<button class="chip" type="button" data-r="today" aria-pressed="true">Today · اليوم</button><button class="chip" type="button" data-r="yest" aria-pressed="false">Yesterday · أمس</button>' +
      '<button class="chip" type="button" data-r="7" aria-pressed="false">7 days · ٧ أيام</button><button class="chip" type="button" data-r="month" aria-pressed="false">This month · الشهر</button>' +
      '<button class="chip" type="button" data-r="lmonth" aria-pressed="false">Last month · الماضي</button></div>' +
      '<div class="dates"><input type="date" id="rf1"><input type="date" id="rf2"></div>' +
      '<div class="two"><button type="button" id="rpdf">📄 PDF</button><button type="button" id="rcsv" class="alt">📊 Excel / CSV</button></div>' +
      '<div class="empty" id="rmsg" style="padding:6px 0 0;font-size:12px"></div></div>';
    $('out').innerHTML = h;
    initReports();
  }
  var LOGO_SRC = (document.querySelector('#login img') || {}).src || '';

  function setR(k) {

    $('rf1').value = iso(f); $('rf2').value = iso(t);
    var cs = document.querySelectorAll('#rch .chip'); for (var i = 0; i < cs.length; i++) cs[i].setAttribute('aria-pressed', cs[i].getAttribute('data-r') === k ? 'true' : 'false');
  }

  }

  function pct(c, p) { if (!p) return ''; var x = Math.round((c - p) / p * 100); return '<span class="dl ' + (x >= 0 ? 'up' : 'dn') + '">' + (x >= 0 ? '▲ ' : '▼ ') + Math.abs(x) + '% vs previous · عن السابق</span>'; }
  function repHTML(d) {
