<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>alala cafe – Book a room · حجز قاعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap">
<style>
:root{--bg:#0B0A08;--fg:#F1EADB;--gold:#D9B861;--muted:#B3AA97;--panel:#15130F;--on-gold:#1A1405;--warn:#E8A27C;--line:rgba(217,184,97,.14);--line2:rgba(217,184,97,.38);--line3:rgba(217,184,97,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jost','IBM Plex Sans Arabic',system-ui,sans-serif;padding-bottom:40px;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:10px}
header img{display:block;width:auto}
.logo-en{height:70px;max-width:60%}.logo-ar{height:44px;max-width:30%}
h1{margin:6px 0 2px;font-weight:500;font-size:22px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:14px}
h1 .ar{font-family:'Reem Kufi','IBM Plex Sans Arabic',sans-serif;font-size:24px}
.sub{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.5}
.sub .ar{display:block}
.lbl{display:flex;justify-content:space-between;margin:20px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}
.lbl .ar{letter-spacing:0;text-transform:none;font-size:15px}
.field input,.field textarea{width:100%;min-height:48px;padding:10px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-radius:12px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field.bad input{border-color:var(--warn)}
.field{margin-bottom:10px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;min-width:46px;padding:0 14px;background:transparent;border:1px solid var(--line2);border-radius:12px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.opt:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}
.rooms .opt{flex:1;min-height:64px;font-size:20px;font-family:'Reem Kufi','Jost',sans-serif}
.rooms .opt small{display:block;font-size:12px;font-weight:400;opacity:.8;font-family:'Jost',sans-serif}
.dur .opt{flex:1 1 30%;min-height:54px;line-height:1.2}
.dur .opt small{display:block;font-size:11px;font-weight:400;opacity:.85}
.note{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.box{margin-top:22px;padding:14px 16px;border:1px solid var(--line3);border-radius:14px;background:var(--panel);font-size:15px;line-height:1.7}
.box b{color:var(--gold);font-weight:500}
.box .ar{display:block;color:var(--muted);font-size:14px}
.price{font-size:18px;color:var(--gold);font-weight:600}
.btn{width:100%;min-height:52px;margin-top:14px;display:flex;justify-content:center;align-items:center;gap:10px;background:transparent;border:1px solid var(--line3);border-radius:999px;font-weight:500;font-size:16px}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn[aria-disabled="true"]{opacity:.45}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.err{margin:10px 0 0;color:var(--warn);font-size:14px;line-height:1.5}
.big{font-size:40px;color:var(--gold);font-weight:600;letter-spacing:.04em;text-align:center;margin:4px 0}
.center{text-align:center}
.link{background:none;border:0;color:var(--gold);text-decoration:underline;font-size:14px;padding:12px 0;margin-top:6px;display:block;width:100%;text-align:center}
.thanks{margin:16px 0 0;font-size:16px;line-height:1.6;text-align:center}
.thanks .ar{display:block;color:var(--gold);font-size:17px}
.warn{margin-top:14px;padding:14px 16px;border:1.5px solid var(--warn);border-radius:14px;background:rgba(232,162,124,.08);font-size:14px;line-height:1.6}
.warn b{display:block;color:var(--warn);font-size:17px;font-weight:600}
.warn .ar{display:block;color:var(--warn);font-size:16px}
.warn p{margin:8px 0 0;color:var(--fg)}
.how{margin-top:14px;padding:12px 16px;border:1px solid var(--line2);border-radius:14px;font-size:14px;line-height:1.7}
.how b{color:var(--gold);font-weight:500}
.how ol{margin:6px 0 0;padding-inline-start:20px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
</style>
</head>

<script>
(function () {
  'use strict';
  var CFG = window.ALALA || {}, API = CFG.API_URL || '';
  var DEF = { ok: true, rooms: ['A', 'B'], open: 540, close: 1440, step: 30, min: 60, max: 360, free: 120, rate: 1000, days: 60 };
  var S = { cfg: DEF, loaded: false, cache: {}, date: '', room: '', start: -1, mins: 60, busy: [], today: '', nowMin: 0, name: '', phone: '', note: '', edit: null, view: 'form', done: null, err: '', sending: false };
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function T(en, ar) { return esc(en) + '<span class="ar" lang="ar" dir="rtl">' + esc(ar) + '</span>'; }
  function lbl(en, ar) { return '<div class="lbl"><span>' + esc(en) + '</span><span class="ar" lang="ar" dir="rtl">' + esc(ar) + '</span></div>'; }
  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function fmt(m) { m = m % 1440; var h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 && h < 24 ? 'pm' : 'am'; if (m === 0) return '12:00 am'; var h12 = h % 12 || 12; return h12 + ':' + two(mm) + ' ' + ap; }
  function fmtEnd(m) { return m >= 1440 ? '12:00 am' : fmt(m); }
  function durLabel(m) { return (m / 60) + 'h'; }
  function extra(m) { return Math.ceil(Math.max(0, m - S.cfg.free) / 60) * S.cfg.rate; }
  function omr(b) { return (b / 1000).toFixed(3).replace(/\.?0+$/, '') || '0'; }
  var ERR = {
    busy: ['That time was just taken. Please pick another.', 'هذا الوقت انحجز للتو، اختر وقتًا آخر.'],
    past: ['That time has already passed.', 'هذا الوقت مضى.'],
    late: ['Bookings must end by 12:00 midnight.', 'يجب أن ينتهي الحجز عند الساعة 12 منتصف الليل.'],
    date: ['Please pick a valid date (up to 60 days ahead).', 'اختر تاريخًا صحيحًا (حتى 60 يومًا قادمة).'],
    start: ['Please pick a start time.', 'اختر وقت البداية.'],
    room: ['Please pick a room.', 'اختر القاعة.'],
    name: ['Please enter your name.', 'اكتب اسمك.'],
    phone: ['Phone number must be exactly 8 digits (no country code).', 'رقم الجوال لازم يكون ٨ أرقام بالضبط (بدون مفتاح الدولة).'],
    notfound: ['Booking not found. Check the number and phone.', 'لم نجد الحجز. تأكد من الرقم والجوال.'],
    locked: ['This booking can no longer be changed. Please call us.', 'لا يمكن تعديل هذا الحجز الآن، تواصل معنا.'],
    net: ['Connection problem. Please try again.', 'مشكلة في الاتصال، حاول مرة أخرى.']
  };
  function errText(c) { var e = ERR[c] || ERR.net; return esc(e[0]) + '<br><span class="ar" lang="ar" dir="rtl">' + esc(e[1]) + '</span>'; }
  function get(q) { return fetch(API + '?' + q).then(function (r) { return r.json(); }); }
  function post(b) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function ymd(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }

  function loadAvail() {
    var q = 'action=rooms&date=' + encodeURIComponent(S.date) + (S.edit ? '&ex=' + S.edit.id : '');
    return get(q).then(function (d) {
      if (!d.ok || !d.rooms) throw 0;
      S.cfg = d; S.busy = d.busy; S.today = d.today; S.nowMin = d.nowMin; S.loaded = true; S.loadErr = false;
      if (!S.date) S.date = d.today;
    });
  }
  function slotOk(start) {
    if (!S.room) return true;
    var end = start + S.mins;
    if (end > S.cfg.close) return false;
    if (S.date === S.today && start < S.nowMin) return false;
    for (var i = 0; i < S.busy.length; i++) { var b = S.busy[i]; if (b.room === S.room && start < b.end && b.start < end) return false; }
    return true;
  }
  function roomBusyCount(r) { var n = 0; S.busy.forEach(function (b) { if (b.room === r) n++; }); return n; }

  function render() {
    if (S.view === 'done') return renderDone();
    if (S.view === 'find') return renderFind();
    var c = S.cfg, h = '';
    h += '<h1><span>' + (S.edit ? 'Change booking' : 'Book a room') + '</span><span class="ar" lang="ar" dir="rtl">' + (S.edit ? 'تعديل الحجز' : 'حجز قاعة') + '</span></h1>';
    h += '<p class="sub">Free for the first 2 hours, then 1 OMR for each extra hour. Open 9:00 am – 12:00 midnight.<span class="ar" lang="ar" dir="rtl">مجانًا لأول ساعتين، وبعدها ريال واحد لكل ساعة إضافية. من 9 صباحًا حتى 12 منتصف الليل.</span></p>';
    h += lbl('Date', 'التاريخ');
    h += '<div class="field"><input type="date" id="fDate" value="' + esc(S.date) + '" min="' + esc(S.today) + '"></div>';
    h += lbl('Room', 'القاعة');
    h += '<div class="grid rooms">';
    c.rooms.forEach(function (r) { h += '<button type="button" class="opt" data-room="' + r + '" aria-pressed="' + (S.room === r) + '">Room ' + r + '<small>قاعة ' + r + '</small></button>'; });
    h += '</div>';
    h += lbl('Duration', 'المدة');
    h += '<p class="note" style="margin:0 0 8px">Need less? 1 hour is fine — pick only the time you need. <span class="ar" lang="ar" dir="rtl">تحتاج أقل؟ ساعة وحدة تكفي — اختر المدة اللي تحتاجها فقط.</span></p>';
    h += '<div class="grid dur">';
    for (var m = c.min; m <= c.max; m += c.step) {
      var ex = extra(m);
      h += '<button type="button" class="opt" data-mins="' + m + '" aria-pressed="' + (S.mins === m) + '">' + durLabel(m) + '<small>' + (ex ? '+' + omr(ex) + ' OMR' : 'Free · مجانًا') + '</small></button>';
    }
    h += '</div>';
    h += lbl('Start time', 'وقت البداية');
    if (!S.room) { h += '<p class="empty">Choose a room first. · اختر القاعة أولًا.</p>'; }
    else {
      h += '<div class="grid" id="slots">';
      var any = false;
      for (var s = c.open; s <= c.close - c.min; s += c.step) { var ok = slotOk(s); if (ok) any = true; h += '<button type="button" class="opt" data-start="' + s + '"' + (ok ? '' : ' disabled') + ' aria-pressed="' + (S.start === s) + '">' + fmt(s) + '</button>'; }
      h += '</div>';
      if (S.loadErr && !S.loaded) h += '<p class="err">' + errText('net') + '</p>';
      else if (!S.loaded) h += '<p class="note">Checking availability… · جارٍ التحقق من المواعيد…</p>';
      else if (!any) h += '<p class="err">No free time for this room and duration on this day. Try another day, room or shorter duration.<br><span class="ar" lang="ar" dir="rtl">لا يوجد وقت متاح لهذه القاعة والمدة في هذا اليوم. جرّب يومًا أو قاعة أخرى أو مدة أقصر.</span></p>';
    }
    h += lbl('Your details', 'بياناتك');
    h += '<div class="field" id="fgName"><input id="fName" autocomplete="name" placeholder="Name · الاسم" value="' + esc(S.name) + '" maxlength="60"></div>';
    h += '<div class="field" id="fgPhone"><input id="fPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="9XXXXXXX · رقم الجوال" value="' + esc(S.phone) + '" maxlength="8"></div>';
    h += '<div class="field"><textarea id="fNote" maxlength="200" placeholder="Note (optional) · ملاحظة (اختياري)">' + esc(S.note) + '</textarea></div>';
    h += '<p class="note">You can write the note in Arabic or English; our team will read it in English.<span class="ar" lang="ar" dir="rtl" style="display:block">تقدر تكتب الملاحظة بالعربي أو الإنجليزي، وفريقنا يقرأها بالإنجليزي.</span></p>';
    if (S.room && S.start >= 0) {
      var e2 = extra(S.mins);
      h += '<div class="box"><b>Room ' + esc(S.room) + '</b> · ' + esc(S.date) + '<br>' + fmt(S.start) + ' – ' + fmtEnd(S.start + S.mins) + ' (' + durLabel(S.mins) + ')<br>' +
        '<span class="price">' + (e2 ? omr(e2) + ' OMR' : 'Free') + '</span>' + (e2 ? ' <span style="color:var(--muted);font-size:13px">pay at the cafe</span>' : '') +
        '<span class="ar" lang="ar" dir="rtl">' + (e2 ? 'يُدفع في الكافيه: ' + omr(e2) + ' ر.ع' : 'مجانًا') + '</span></div>';
    }
    if (S.err) h += '<p class="err">' + errText(S.err) + '</p>';
    h += '<button type="button" class="btn primary" id="go" aria-disabled="' + (!!S.sending) + '">' + (S.edit ? 'Save changes · حفظ التعديل' : 'Confirm booking · تأكيد الحجز') + '</button>';
    if (S.edit) {
      h += '<button type="button" class="btn danger" id="cancelB">Cancel this booking · إلغاء الحجز</button><button type="button" class="link" id="back">Keep booking · إبقاء الحجز</button>';
    } else {
      h += '<button type="button" class="link" id="findB">Change or cancel my booking · تعديل أو إلغاء حجزي</button>';
    }
    app.innerHTML = h;
  }
  function renderDone() {
    var b = S.done, e = extra(b.mins), h = '';
    h += '<h1><span>' + (S.doneMsg || 'Booking confirmed') + '</span><span class="ar" lang="ar" dir="rtl">' + (S.doneAr || 'تم تأكيد الحجز') + '</span></h1>';
    h += '<div class="box center"><div class="sub" style="margin:0">Booking no. · رقم الحجز</div><div class="big">#' + esc(b.id) + '</div>' +
      '<b>Room ' + esc(b.room) + '</b> · ' + esc(b.date) + '<br>' + fmt(b.start) + ' – ' + fmtEnd(b.start + b.mins) + '<br>' + esc(b.name) +
      (e ? '<br><span class="price">' + omr(e) + ' OMR</span> <span style="color:var(--muted);font-size:13px">pay at the cafe · يُدفع في الكافيه</span>' : '<br><span class="price">Free · مجانًا</span>') + '</div>';
    h += '<p class="thanks">Thank you for choosing alala cafe for your booking. We look forward to serving you always.<span class="ar" lang="ar" dir="rtl">شكرًا لاختيارك ألالا كافيه للحجز، ونتطلع لخدمتك دائمًا.</span></p>';
    h += '<div class="warn"><b>⚠ Do not forget to save your booking number: #' + esc(b.id) + '</b><span class="ar" lang="ar" dir="rtl">لا تنسَ حفظ رقم الحجز: <bdi dir="ltr">#' + esc(b.id) + '</bdi></span>' +
      '<p>Take a screenshot of this page or write the number down. You will need it, with your phone number, to change or cancel your booking.</p>' +
      '<p class="ar" lang="ar" dir="rtl">صوّر هذه الصفحة أو اكتب الرقم. تحتاجه مع رقم جوالك لتعديل الحجز أو إلغائه.</p></div>';
    h += '<div class="how"><b>How to change or cancel · كيف أعدّل أو ألغي؟</b><ol><li>Open this page again · افتح هذه الصفحة مرة أخرى</li><li>Tap “Change or cancel my booking” · اضغط «تعديل أو إلغاء حجزي»</li><li>Enter your booking number and phone · اكتب رقم الحجز والجوال</li></ol></div>';
    h += '<button type="button" class="btn" id="chg">Change or cancel now · تعديل أو إلغاء الآن</button><button type="button" class="link" id="newB">New booking · حجز جديد</button>';
    app.innerHTML = h;
  }
  function renderFind() {
    var h = '<h1><span>Change or cancel booking</span><span class="ar" lang="ar" dir="rtl">تعديل أو إلغاء الحجز</span></h1><p class="sub">Enter the booking number you saved and your phone number.<span class="ar" lang="ar" dir="rtl">اكتب رقم الحجز الذي حفظته ورقم جوالك.</span></p>';
    h += '<div class="field" style="margin-top:14px"><input id="fId" inputmode="numeric" placeholder="Booking no. · رقم الحجز" value="' + esc(S.findId || '') + '"></div>';
    h += '<div class="field"><input id="fPh" type="tel" inputmode="numeric" maxlength="8" placeholder="9XXXXXXX · رقم الجوال" value="' + esc(S.phone) + '"></div>';
    if (S.err) h += '<p class="err">' + errText(S.err) + '</p>';
    h += '<button type="button" class="btn primary" id="findGo">Find · بحث</button><button type="button" class="link" id="back2">Back · رجوع</button>';
    app.innerHTML = h;
  }

  function cleanPhone(v) {
    v = String(v || '').replace(/[٠-٩]/g, function (c) { return c.charCodeAt(0) - 1632; }).replace(/[۰-۹]/g, function (c) { return c.charCodeAt(0) - 1776; }).replace(/\D/g, '');
    if (v.length > 8 && v.indexOf('968') === 0) v = v.slice(3);
    return v.slice(0, 8);
  }
  function setErr(c) { S.err = c; render(); var e = app.querySelector('.err'); if (e && e.scrollIntoView) e.scrollIntoView({ block: 'center' }); }
  function readFields() {
    var n = document.getElementById('fName'), p = document.getElementById('fPhone'), t = document.getElementById('fNote');
    if (n) S.name = n.value; if (p) S.phone = cleanPhone(p.value); if (t) S.note = t.value;
  }
  function refreshAvail() { S.loaded = false; return loadAvail().then(function () { if (S.start >= 0 && !slotOk(S.start)) S.start = -1; render(); }).catch(function () { setErr('net'); }); }
  function submit() {
    readFields(); S.err = '';
    if (S.sending) return;
    if (!S.room) return setErr('room');
    if (S.start < 0) return setErr('start');
    if (!S.name.trim()) { setErr('name'); var a = document.getElementById('fgName'); if (a) a.className += ' bad'; return; }
    if (cleanPhone(S.phone).length !== 8) { setErr('phone'); var b2 = document.getElementById('fgPhone'); if (b2) b2.className += ' bad'; return; }
    S.sending = true; render();
    var body = { action: S.edit ? 'bookmod' : 'book', name: S.name.trim(), phone: S.phone, date: S.date, start: S.start, mins: S.mins, room: S.room, note: S.note.trim() };
    if (S.edit) body.id = S.edit.id;
    post(body).then(function (d) {
      S.sending = false;
      if (!d.ok) { if (d.error === 'busy' || d.error === 'past') { S.start = -1; refreshAvail().then(function () { setErr(d.error); }); return; } return setErr(d.error || 'net'); }
      var bk = d.booking;
      if (S.edit) { bk.id = S.edit.id; bk.name = S.name.trim(); S.doneMsg = 'Booking updated'; S.doneAr = 'تم تعديل الحجز'; }
      else { S.doneMsg = ''; S.doneAr = ''; }
      S.done = bk; S.edit = null; S.view = 'done';
      try { localStorage.setItem('alala_room', JSON.stringify({ id: bk.id, phone: S.phone })); } catch (x) {}
      render(); window.scrollTo(0, 0);
    }).catch(function () { S.sending = false; setErr('net'); });
  }
  function loadBooking(id, phone) {
    return get('action=bookget&id=' + encodeURIComponent(id) + '&phone=' + encodeURIComponent(phone)).then(function (d) {
      if (!d.ok) { S.err = d.error || 'notfound'; return false; }
      var b = d.booking;
      if (b.status !== 'confirmed') { S.err = 'locked'; return false; }
      S.edit = { id: b.id }; S.phone = phone; S.name = b.name; S.date = b.date; S.room = b.room; S.start = b.start; S.mins = b.mins; S.note = b.note || '';
      S.err = ''; S.view = 'form';
      return refreshAvail().then(function () { return true; });
    }).catch(function () { S.err = 'net'; return false; });
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.disabled) return;
    readFields();
    if (t.dataset.room) { S.room = t.dataset.room; if (S.start >= 0 && !slotOk(S.start)) S.start = -1; S.err = ''; render(); }
    else if (t.dataset.mins) { S.mins = parseInt(t.dataset.mins, 10); if (S.start >= 0 && !slotOk(S.start)) S.start = -1; S.err = ''; render(); }
    else if (t.dataset.start) { S.start = parseInt(t.dataset.start, 10); S.err = ''; render(); }
    else if (t.id === 'go') submit();
    else if (t.id === 'findB') { S.view = 'find'; S.err = ''; render(); }
    else if (t.id === 'back2') { S.view = 'form'; S.err = ''; render(); }
    else if (t.id === 'findGo') {
      var id = (document.getElementById('fId').value || '').replace(/\D/g, ''), ph = cleanPhone(document.getElementById('fPh').value); S.findId = id; S.phone = ph;
      loadBooking(id, ph).then(function (ok) { if (!ok) render(); });
    }
    else if (t.id === 'chg') { loadBooking(S.done.id, S.phone).then(function (ok) { if (!ok) { S.view = 'find'; S.findId = S.done.id; render(); } }); }
    else if (t.id === 'newB') { S.view = 'form'; S.done = null; S.edit = null; S.room = ''; S.start = -1; S.note = ''; S.err = ''; refreshAvail(); window.scrollTo(0, 0); }
    else if (t.id === 'back') { S.view = 'form'; S.edit = null; S.room = ''; S.start = -1; S.err = ''; refreshAvail(); }
    else if (t.id === 'cancelB') {
      if (!window.confirm('Cancel this booking?\nإلغاء هذا الحجز؟')) return;
      post({ action: 'bookmod', id: S.edit.id, phone: S.phone, cancel: true }).then(function (d) {
        if (!d.ok) return setErr(d.error || 'net');
        S.view = 'done'; S.done = { id: S.edit.id, room: S.room, date: S.date, start: S.start, mins: 60, name: S.name };
        S.edit = null; app.innerHTML = '<h1><span>Booking cancelled</span><span class="ar" lang="ar" dir="rtl">تم إلغاء الحجز</span></h1><button type="button" class="btn" id="newB">New booking · حجز جديد</button>';
      }).catch(function () { setErr('net'); });
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'fDate') { readFields(); S.date = e.target.value || S.today; S.start = -1; S.loaded = false; render(); refreshAvail(); }
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'fName') S.name = e.target.value; if (e.target.id === 'fPhone' || e.target.id === 'fPh') { var cp = cleanPhone(e.target.value); if (e.target.value !== cp) e.target.value = cp; } });

  if (!API) { app.innerHTML = '<p class="empty">Booking is not available right now. · الحجز غير متاح حاليًا.</p>'; return; }
  S.date = ymd(new Date()); S.today = S.date; S.nowMin = 0;
  var sp = (location.search.match(/[?&]b=(\d+)/) || [])[1], saved = null;
  try { saved = JSON.parse(localStorage.getItem('alala_room') || 'null'); } catch (x) {}
  if (sp) { S.view = 'find'; S.findId = sp; if (saved && String(saved.id) === sp) S.phone = saved.phone; }
  render();
  loadAvail().then(function () { if (S.view === 'form' && !S.edit) { S.date = S.date < S.today ? S.today : S.date; } render(); })
    .catch(function () { S.loadErr = true; render(); });
}());
</script>
</body>
</html>
