<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A08">
<title>alala cashier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0B0A08;--panel:#15130f;--panel2:#1c1913;--fg:#F3EEE2;--muted:#a79f8d;--dim:#7d7667;--gold:#D9B861;--on-gold:#1a1405;--line:rgba(217,184,97,.22);--line2:rgba(217,184,97,.38);--ok:#7fd08a;--warn:#ff8c78;--blue:#7fb2ff}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif}
.ar{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(11,10,8,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-block:8px}
header.top img{height:30px}
.tabs{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.tab{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent}
.tab[aria-selected=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.tab .n{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:999px;background:var(--warn);color:#1a0b07;font-size:12px;font-weight:700}
.sbtn{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.sbtn.on-warn{border-color:rgba(255,140,120,.6);color:var(--warn)}
.login{max-width:340px;margin:18vh auto 0;padding:24px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.login img{height:44px;margin-bottom:14px}
.login input{width:100%;min-height:50px;padding:10px 14px;text-align:center;font-size:20px;letter-spacing:6px;background:var(--bg);border:1px solid var(--line2);border-radius:12px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.ok{background:#1d3a22;border-color:#2f6a3a;color:var(--ok)}
.btn.blue{background:#16283f;border-color:#2c4f80;color:var(--blue)}
.btn.bad{border-color:rgba(255,140,120,.5);color:var(--warn);background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.err{margin:10px 0 0;color:var(--warn);font-size:14px}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:0 12px;min-height:44px;color-scheme:dark}
textarea{padding:10px 12px;min-height:60px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding:16px 0 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.new{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.card .hd{display:flex;align-items:center;gap:10px}
.tbl{min-width:58px;padding:4px 10px;border-radius:12px;background:var(--gold);color:var(--on-gold);font-size:22px;font-weight:700;text-align:center;line-height:1.2}
.tbl small{display:block;font-size:10px;font-weight:600;opacity:.75}
.tbl.t-pickup{background:#7fb2ff}.tbl.t-delivery{background:#ff9f6e}.tbl.t-counter{background:#b9b2a2}
.tbl .ic{font-size:22px}
.hd .meta{flex:1;min-width:0}
.hd .no{font-weight:600}
.hd .ago{font-size:12px;color:var(--muted)}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line2);color:var(--gold);white-space:nowrap}
.pill.preparing{color:var(--blue);border-color:#2c4f80}
.pill.ready{color:#ffd66e;border-color:#8a7430}
.pill.served{color:var(--ok);border-color:#2f6a3a}
.pill.paid{background:#1d3a22;color:var(--ok);border-color:#2f6a3a}
.pill.cancelled{color:var(--warn);border-color:rgba(255,140,120,.5)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline}
.lines .q{font-weight:700;color:var(--gold)}
.lines .nm .ar{display:block;font-size:13px;color:var(--muted)}
.lines .pr{color:var(--muted);font-variant-numeric:tabular-nums}
.note{padding:8px 10px;border-radius:10px;background:var(--panel2);color:var(--muted);font-size:13px}
.deliv{padding:8px 10px;border-radius:10px;background:#2a1d14;border:1px solid #6b4a2f;font-size:13px;display:flex;flex-direction:column;gap:4px}
.deliv a{color:var(--gold)}
.cust{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold)}
.dot.on{background:var(--gold)}
.free{padding:1px 8px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:12px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.tot b{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.lbanner{padding:10px 12px;border-radius:12px;background:#1d3a22;border:1px solid #2f6a3a;color:var(--ok);font-weight:700;font-size:14px;text-align:center}
.lbanner.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.ltoast{position:fixed;left:12px;right:12px;top:12px;z-index:90;max-width:560px;margin:0 auto;padding:16px;border-radius:16px;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:17px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.redeem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--gold);border-radius:10px;font-size:13px;color:var(--gold)}
.redeem input{width:20px;height:20px;min-height:0;accent-color:#D9B861}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto;min-width:96px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:16px 0}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.tile .d{font-size:12px}
.d.up{color:var(--ok)}.d.down{color:var(--warn)}.d.flat{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:end;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child,td.l,th.l{text-align:start}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:60px;background:var(--bg)}
h3.sec{margin:24px 0 8px;font-size:15px;color:var(--gold)}
.tw{overflow-x:auto}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:8px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:#a79f8d;font-size:10px}
svg.chart .bar{fill:#D9B861}
svg.chart .bar2{fill:#7fb2ff}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb .r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r .bg{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.hb .r .bg i{display:block;height:100%;background:var(--gold);border-radius:5px}
.hb .r .vv{color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13px}
.chip[aria-pressed=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px 0 60px;align-items:start}
@media (max-width:900px){.pos{grid-template-columns:1fr}}
.pos .menu{display:flex;flex-direction:column;gap:10px}
.pos .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{display:flex;flex-direction:column;gap:4px;text-align:start;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:78px}
.it:active{background:var(--panel2)}
.it .en{font-weight:600;font-size:14px;line-height:1.25}
.it .ar{font-size:12px;color:var(--muted)}
.it .p{margin-top:auto;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.it.has-opts{grid-column:span 2}
.dl{align-self:center;color:var(--muted);font-size:12px;margin-inline-end:4px}
.it .th{display:block;width:100%;height:112px;object-fit:contain;border-radius:10px;margin-bottom:4px;background:#000}
.it .oc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.it .oc button{min-height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:12px}
.cartbox{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cartbox .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cartbox input,.cartbox select{width:100%}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.cl .ar{display:block;font-size:12px;color:var(--muted)}
.cl .q{display:flex;align-items:center;gap:6px}
.cl .q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2)}
.sumln{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.sumln.big{color:var(--gold);font-size:20px;font-weight:700}

/* modal + sold-out bar + edit */
.mdl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.78);padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mdl[hidden]{display:none}
.mbox{display:block;width:100%;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:16px}
.mbox>*{margin-top:0;margin-bottom:10px}
.mbox .acts .btn{margin:0 4px 4px 0}
.mbox h3{margin:0;color:var(--gold);font-size:17px}
.mbox input{width:100%}
.el{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.el .ar{display:block;font-size:12px;color:var(--muted)}
.el .q{display:flex;align-items:center;gap:6px}
.el .q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2)}
.el .x{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,140,120,.5);background:transparent;color:var(--warn)}
.offbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 0 0;font-size:13px;color:var(--muted)}
.offbar .chip{border-color:rgba(255,140,120,.5);color:var(--warn)}
.lines li.offl .nm{color:var(--warn)}
.na{min-height:26px;padding:0 8px;border-radius:8px;border:1px solid rgba(255,140,120,.45);background:transparent;color:var(--warn);font-size:11px}
.flag{padding:6px 10px;border-radius:10px;background:#3a1c18;border:1px solid rgba(255,140,120,.5);color:var(--warn);font-size:13px}
.edtag{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 7px;margin-inline-start:6px}
/* invoice: hidden on screen, the only thing printed */
#invoice{display:none}
@page{margin:4mm}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#invoice){display:none!important}
  #invoice{display:block!important;width:72mm;margin:0 auto;color:#000;font:12px/1.35 'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif}
}
#invoice .c{text-align:center}
#invoice img{height:34px;filter:brightness(0)}
#invoice h1{margin:4px 0 0;font-size:15px}
#invoice .sm{font-size:11px}
#invoice hr{border:0;border-top:1px dashed #000;margin:7px 0}
#invoice table{margin:0;width:100%;border-collapse:collapse}
#invoice th,#invoice td{padding:2px 0;border:0;font-size:12px;color:#000;text-align:start;vertical-align:top;position:static;background:none}
#invoice td.n,#invoice th.n{text-align:end;white-space:nowrap}
#invoice .ar{display:block;font-size:11px;color:#000}
#invoice .row{display:flex;justify-content:space-between;gap:8px}
#invoice .big{font-size:15px;font-weight:700}
</style>
</head>

<script>
(function () {
  var CFG = window.ALALA || {};
  var API = CFG.API_URL || '';
  var MENU = window.ALALA_MENU || [];
  var CUR = 'OMR';
  var STAMPS = 10;
  var pin = '';
  function normPin(v) { return String(v || '').replace(/[\u0660-\u0669]/g, function (c) { return c.charCodeAt(0) - 0x660; }).replace(/[\u06F0-\u06F9]/g, function (c) { return c.charCodeAt(0) - 0x6F0; }).replace(/\s+/g, ''); }
  var cfg = { nameEn: 'alala cafe', nameAr: 'ألالا كافيه', taxNo: '', vatRate: 0.05, fee: 0, min: 0, paused: false };
  var cyc = 0, orders = [], seen = null, soundOn = true, tab = 'active', timer = 0, audioCtx = null, busy = false;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function latin(s) { return String(s || '').replace(/[\u0660-\u0669]/g, function (c) { return c.charCodeAt(0) - 0x660; }).replace(/[\u06F0-\u06F9]/g, function (c) { return c.charCodeAt(0) - 0x6F0; }); }
  function f3(n) { return (Math.round((Number(n) || 0) * 1000) / 1000).toFixed(3); }
  function q(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  // ---- network ----
  function get(params) {
    var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(API + '?' + qs).then(function (r) { return r.json(); });
  }
  function post(body) {
    body.pin = pin;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }

  // ---- login ----
  function showLoginErr(m) { var e = $('loginErr'); e.textContent = m; e.hidden = !m; }
  function tryLogin(p, silent) {
    if (!API) { showLoginErr('API_URL is empty in config.js · لم يتم ضبط الرابط في config.js'); return; }
    pin = p;
    get({ action: 'config', pin: p }).then(function (d) {
      if (!d || !d.ok) { pin = ''; try { sessionStorage.removeItem('alala_pin'); } catch (e) {} if (!silent) showLoginErr('Wrong PIN · الرمز غير صحيح'); return; }
      cfg = d; STAMPS = d.stampsForFree || STAMPS;
      if (APP) { var wv = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1]; if (wv && +wv < 84) { var wb = $('ver'); wb.textContent = 'WebView ' + wv + ' قديم · حدّثه'; wb.style.cssText = 'pointer-events:none;color:#ffcc66;border-color:#ffcc66'; } }
      if (!(d.ver >= 5)) { var vb = $('ver'); vb.textContent = 'v7 · ⚠ Apps Script قديم · حدّثه'; vb.style.cssText = 'pointer-events:none;color:#ff8a7a;border-color:#ff8a7a'; }
      try { sessionStorage.setItem('alala_pin', p); } catch (e) {}
      $('login').hidden = true; $('app').hidden = false;
      initAudio(); renderPause(); posInit(); refresh(); timer = setInterval(refresh, 6000);
    }).catch(function () { if (!silent) showLoginErr('No connection · لا يوجد اتصال'); });
  }
  $('loginBtn').addEventListener('click', function () { showLoginErr(''); tryLogin(normPin($('pin').value)); });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logout').addEventListener('click', function () {
    clearInterval(timer); pin = ''; seen = null; try { sessionStorage.removeItem('alala_pin'); } catch (e) {}
    $('app').hidden = true; $('login').hidden = false; $('pin').value = '';

      items: pos.cart.map(function (l) {

      lastA = d; var t = d.totals, p = d.prev;
      var avg = t.orders ? t.total / t.orders : 0, pavg = p.orders ? p.total / p.orders : 0;
      var tile = function (k, v, dl) { return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (dl || '') + '</div>'; };
      var h = '<div class="tiles">' + tile('Sales · المبيعات', f3(t.total), delta(t.total, p.total)) + tile('Orders · الطلبات', t.orders, delta(t.orders, p.orders)) +
        tile('Avg. order · متوسط الطلب', f3(avg), delta(avg, pavg)) + tile('VAT 5% · الضريبة', f3(t.vat)) + tile('Subtotal · قبل الضريبة', f3(t.subtotal)) +
        tile('Discounts · خصومات', f3(t.discount)) + tile('Cash · كاش', f3(t.cash)) + tile('Card · فيزا', f3(t.card)) + '</div>';
      h += '<div class="two"><div class="panelbox"><h3 class="sec" style="margin-top:0">Sales by day · المبيعات يومياً</h3>' + vbars(d.days.map(function (x) { return { l: x.date, v: x.total }; }), function (l) { return l.slice(5); }) + '</div>' +
        '<div class="panelbox"><h3 class="sec" style="margin-top:0">Orders by hour · الطلبات حسب الساعة</h3>' + vbars(d.hours.map(function (x) { return { l: x.h + ':00', v: x.orders, t: x.orders + ' orders' }; }), function (l) { return parseInt(l, 10) % 3 === 0 ? l.replace(':00', '') : ''; }, 'bar2') + '</div></div>';
      var wn = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      h += '<div class="two"><div class="panelbox"><h3 class="sec" style="margin-top:0">By weekday · حسب اليوم</h3>' + vbars(d.weekdays.map(function (x) { return { l: wn[x.d - 1], v: x.total }; })) + '</div>' +
        '<div class="panelbox"><h3 class="sec" style="margin-top:0">Order types · أنواع الطلبات</h3>' + hbars(d.types.map(function (x) { return { l: TYPE_NAME[x.type] || x.type, v: x.total, t: f3(x.total) + ' (' + x.orders + ')' }; })) +
        '<h3 class="sec">Payment · الدفع</h3>' + hbars([{ l: 'Cash · كاش', v: t.cash }, { l: 'Card · فيزا', v: t.card }]) + '</div></div>';
      var c = d.customers;
      h += '<div class="two"><div class="panelbox"><h3 class="sec" style="margin-top:0">Categories · الأقسام</h3>' + hbars(d.sections.map(function (x) { return { l: SEC_NAME[x.id] || x.id, v: x.sales }; })) + '</div>' +
        '<div class="panelbox"><h3 class="sec" style="margin-top:0">Customers · العملاء</h3>' + hbars([
          { l: 'New · جدد', v: c.fresh, t: String(c.fresh) }, { l: 'Returning · عائدون', v: c.returning, t: String(c.returning) },
          { l: 'With phone · بجوال', v: c.withPhone, t: c.withPhone + ' orders' }, { l: 'Anonymous · بدون جوال', v: c.anonymous, t: c.anonymous + ' orders' }]) + '</div></div>';
      h += '<h3 class="sec">Top items · الأكثر مبيعاً</h3><div class="panelbox">' + hbars(d.items.slice(0, 12).map(function (x) { return { l: x.en + (x.ar ? ' · ' + x.ar : ''), v: x.qty, t: x.qty + ' · ' + f3(x.sales) }; })) + '</div>';
      h += '<h3 class="sec">Daily · يومي</h3><div class="tw"><table><thead><tr><th>Date</th><th>Orders</th><th>Subtotal</th><th>Disc.</th><th>VAT</th><th>Total</th><th>Cash</th><th>Card</th></tr></thead><tbody>';
      d.days.forEach(function (r) { h += '<tr><td>' + r.date + '</td><td>' + r.orders + '</td><td>' + f3(r.subtotal) + '</td><td>' + f3(r.discount) + '</td><td>' + f3(r.vat) + '</td><td>' + f3(r.total) + '</td><td>' + f3(r.cash) + '</td><td>' + f3(r.card) + '</td></tr>'; });
      $('rOut').innerHTML = h + '</tbody></table></div>';
    }).catch(function () { $('rOut').innerHTML = '<div class="empty">No connection · لا يوجد اتصال</div>'; });
  }
  $('rGo').addEventListener('click', function () { q('[data-ap]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); loadAnalytics(); });
  $('rCsv').addEventListener('click', function () {
    if (!lastA) { loadAnalytics(); return; }
    var rows = [['Date', 'Orders', 'Subtotal', 'Discount', 'VAT', 'Total', 'Cash', 'Card']];
    lastA.days.forEach(function (r) { rows.push([r.date, r.orders, f3(r.subtotal), f3(r.discount), f3(r.vat), f3(r.total), f3(r.cash), f3(r.card)]); });
    download('alala-sales-' + lastA.from + '_' + lastA.to + '.csv', rows);
  });
  setRange('today');

  var saved = ''; try { saved = sessionStorage.getItem('alala_pin') || ''; } catch (e) {}
  if (saved) tryLogin(saved, true);
  if (!API) showLoginErr('API_URL is empty in config.js · لم يتم ضبط الرابط في config.js');
})();
</script>
</body>
</html>
